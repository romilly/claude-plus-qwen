<!DOCTYPE html>
<html>
<head>
    <title>Menace Fix Test</title>
</head>
<body>
    <h2>Testing MENACE Implementation</h2>
    <p>Open browser console to see debugging information.</p>
    <p>This test verifies that MENACE can make moves properly.</p>

    <script>
        // Game state (simplified for testing)
        const state = {
            board: [null, null, null, null, null, null, null, null, null],
            matchboxes: {},
            beadCounts: {}
        };

        // Winning combinations
        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
            [0, 4, 8], [2, 4, 6]             // diagonals
        ];

        // Get possible moves
        function getPossibleMoves(board) {
            return board.map((cell, index) => cell === null ? index : null).filter(index => index !== null);
        }

        // Convert board state to a string key for matchbox storage
        function getBoardKey(board) {
            return board.join('');
        }

        // Initialize beads for a board position if not already done
        function initializeBeadsForPosition(board) {
            const key = getBoardKey(board);
            if (!state.matchboxes[key]) {
                state.matchboxes[key] = [];

                // Get possible moves for this position
                const possibleMoves = getPossibleMoves(board);

                // Initialize with default beads: 3 of each color for first 3 moves, then yellow for others
                for (let i = 0; i < possibleMoves.length; i++) {
                    const move = possibleMoves[i];
                    if (i === 0) {
                        state.matchboxes[key].push({move: move, color: 'red'});
                    } else if (i === 1) {
                        state.matchboxes[key].push({move: move, color: 'blue'});
                    } else if (i === 2) {
                        state.matchboxes[key].push({move: move, color: 'green'});
                    } else {
                        // Add more beads for other moves if needed
                        state.matchboxes[key].push({move: move, color: 'yellow'});
                    }
                }
                // Track bead count for statistics
                state.beadCounts[key] = possibleMoves.length;
            }
        }

        // MENACE makes a move based on beads (simplified version)
        function menaceMove() {
            const possibleMoves = getPossibleMoves(state.board);

            if (possibleMoves.length === 0) {
                return null; // No moves left
            }

            // Get the beads for current board state
            const key = getBoardKey(state.board);
            initializeBeadsForPosition(state.board);
            const beads = state.matchboxes[key] || [];

            console.log(`MENACE move test: ${possibleMoves.length} possible moves, ${beads.length} beads available`);

            // Randomly select a bead from available beads
            if (beads.length > 0) {
                const randomIndex = Math.floor(Math.random() * beads.length);
                const selectedMove = beads[randomIndex].move;
                console.log(`MENACE chose move ${selectedMove} from beads`);
                return selectedMove;
            }

            // Fallback: choose a random available move
            const randomIndex = Math.floor(Math.random() * possibleMoves.length);
            const fallbackMove = possibleMoves[randomIndex];
            console.log(`MENACE chose fallback move ${fallbackMove}`);
            return fallbackMove;
        }

        // Test the implementation
        console.log("Testing MENACE move selection...");

        // Test 1: Empty board
        state.board = [null, null, null, null, null, null, null, null, null];
        console.log("Test 1 - Empty board:");
        console.log("Board before:", state.board);
        const move1 = menaceMove();
        console.log("Board after:", state.board);
        console.log("Move chosen:", move1);

        // Test 2: After human move
        state.board = ['X', null, null, null, null, null, null, null, null];
        console.log("\nTest 2 - After human move:");
        console.log("Board before:", state.board);
        const move2 = menaceMove();
        console.log("Board after:", state.board);
        console.log("Move chosen:", move2);

        console.log("\nTest completed!");
    </script>
</body>
</html>
